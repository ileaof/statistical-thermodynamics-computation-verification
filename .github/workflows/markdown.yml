name: Markdown validation

on:
  push:
    branches: [main, master]
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
