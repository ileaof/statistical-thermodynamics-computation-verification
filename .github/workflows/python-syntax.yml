name: Python syntax and style

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Compile every module and lint the library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Byte-compile all Python (syntax check)
        # Fails on any SyntaxError anywhere in the repository, including examples.
        run: python -m compileall -q src tests tools Chapter*

      - name: Lint the library, tests and tools (flake8)
        run: flake8 src tests tools
