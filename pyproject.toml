[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-thermodynamics"
version = "1.0.0"
description = "Companion computational library for the textbook 'Statistical Thermodynamics: Theory, Computation, and Molecular Applications'."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "I. L. Ferreira" }]
keywords = [
    "statistical thermodynamics",
    "statistical mechanics",
    "computational physics",
    "Monte Carlo",
    "molecular dynamics",
    "physical chemistry",
    "education",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=5.0",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/ileaof/statistical-thermodynamics-computation-verification"
Repository = "https://github.com/ileaof/statistical-thermodynamics-computation-verification"
Issues = "https://github.com/ileaof/statistical-thermodynamics-computation-verification/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statistical_thermodynamics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
