name: H2S
formula: H2S
molar_mass_gmol: 34.0809
geometry: nonlinear
n_atoms: 3
symmetry_number: 2
# Rotational constants A=10.374, B=8.991, C=4.732 cm-1 -> theta = hc*B/k
rotational_temperatures: [14.93, 12.94, 6.81]
vibrational_modes:
  - {wavenumber_cm1: 2615.0, degeneracy: 1}    # nu1 symmetric stretch
  - {wavenumber_cm1: 1183.0, degeneracy: 1}    # nu2 bend
  - {wavenumber_cm1: 2626.0, degeneracy: 1}    # nu3 asymmetric stretch
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Herzberg; NIST CCCDB. Nonlinear, sigma=2."

lennard_jones:
  sigma_angstrom: 3.623
  epsilon_over_k: 301.1
  note: "Poling/PCO; polar - LJ approximate"

# Validated accuracy of the transport coefficients. Metadata only: nothing here enters
# a calculation. Recorded so a consumer (a CFD solver, say) can see which coefficients
# it can trust and which it cannot.
transport_accuracy:
  viscosity_percent: 2.3
  conductivity_percent: 18.7
  diffusion_percent: 12.0
  basis: "Measured at 300 K against Poling/PCO and CRC (mu, k) and tabulated binary D; see docs/TRANSPORT_CORRECTION_REPORT.md"
  limitation: "Strongly polar: internal-energy transport is suppressed by resonant dipolar exchange (required f_int = 0.54 vs the >= 1 that every mass-diffusion model gives). Beyond Eucken and Mason-Monchick alike."
