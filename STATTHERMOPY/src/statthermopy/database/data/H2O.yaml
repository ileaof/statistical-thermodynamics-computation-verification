name: H2O
formula: H2O
molar_mass_gmol: 18.01528
geometry: nonlinear
n_atoms: 3
symmetry_number: 2
# Rotational constants A=27.877, B=14.512, C=9.285 cm-1 -> theta = hc*B/k
rotational_temperatures: [40.13, 20.87, 13.36]
vibrational_modes:
  - {wavenumber_cm1: 3657.0, degeneracy: 1}    # nu1 symmetric stretch
  - {wavenumber_cm1: 1595.0, degeneracy: 1}    # nu2 bend
  - {wavenumber_cm1: 3756.0, degeneracy: 1}    # nu3 asymmetric stretch
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Herzberg; NIST CCCDB. Nonlinear asymmetric top, sigma=2."

# Second-order (Dunham) anharmonicity. Supersedes the harmonic oscillators above: the engine
# sums over the real level manifold instead of equally spaced ladders. These are spectroscopic
# constants, not property correlations — the core stays pure statistical mechanics.
# Self-check: they reproduce the observed fundamentals 3657 / 1595 / 3756 cm-1 to <= 1.7 cm-1,
# and give ZPE = 4634.6 cm-1. Mode order matches vibrational_modes above (nu1, nu2, nu3).
anharmonicity:
  harmonic_wavenumbers_cm1: [3832.17, 1648.47, 3942.53]   # omega_e, NOT the fundamentals
  x_matrix_cm1:
    - [-42.576, -15.933, -165.824]
    - [-15.933, -16.813,  -20.332]
    - [-165.824, -20.332, -46.370]
  dissociation_cm1: 41000.0        # D0(H-OH) ~ 41145 cm-1; truncates the asymptotic expansion
  reference: "Herzberg, Molecular Spectra II; NIST CCCBDB. omega_e and x_ij for H2O X1A1."

lennard_jones:
  sigma_angstrom: 2.641
  epsilon_over_k: 809.1
  note: "Poling/PCO; polar - LJ approximate. Superseded by the stockmayer block below for the
    pure-species transport path; still used for binary pairs."

# Stockmayer potential (LJ 12-6 + point dipole). Water is strongly polar (1.85 D) and the
# spherically symmetric LJ fit over-predicts its viscosity by ~10 % at 300 K. The Stockmayer set
# plus Brokaw's delta correction to the collision integrals brings that to ~2 %. delta = 1.0 is
# the textbook reduced dipole of water. These are molecular potential parameters, not property
# correlations. Validated over 300-1000 K: mean |error| in mu falls from 4.9 % to 3.0 %.
stockmayer:
  sigma_angstrom: 2.52
  epsilon_over_k: 775.0
  dipole_debye: 1.85
  reference: "Brokaw (1969); Poling, Prausnitz & O'Connell Table 9-1. Stockmayer fit for H2O."

# Validated accuracy of the transport coefficients. Metadata only: nothing here enters
# a calculation. Recorded so a consumer (a CFD solver, say) can see which coefficients
# it can trust and which it cannot.
transport_accuracy:
  viscosity_percent: 2.3
  conductivity_percent: 25.0
  diffusion_percent: 16.0
  basis: "Measured at 300 K against Poling/PCO and CRC (mu, k) and tabulated binary D; see docs/TRANSPORT_CORRECTION_REPORT.md"
  limitation: "Strongly polar: internal-energy transport is suppressed by resonant dipolar exchange (required f_int = 0.38 vs the >= 1 that every mass-diffusion model gives). Beyond Eucken and Mason-Monchick alike."
