name: C2H6
formula: C2H6
molar_mass_gmol: 30.0690
geometry: nonlinear
n_atoms: 8
symmetry_number: 6
# Rotational constants A=2.681, B=C=0.666 cm-1 -> theta = hc*B/k
rotational_temperatures: [3.86, 0.959, 0.959]
# 18 internal DOF (D3d): 3a_g + 3e_g(doubly deg) + 4e_u(doubly deg) as harmonic oscillators
# (= 17 oscillators), PLUS the a_u C-C torsion treated as a 1-D hindered internal rotor below.
# 17 oscillators + 1 internal rotor = 18 = 3N-6. Values are literature fundamentals
# (NIST CCCDB / Herzberg).
vibrational_modes:
  - {wavenumber_cm1: 2954.0, degeneracy: 1}    # a_g CH3 sym stretch
  - {wavenumber_cm1: 1468.0, degeneracy: 1}    # a_g CH3 deform
  - {wavenumber_cm1: 995.0, degeneracy: 1}     # a_g C-C stretch
  - {wavenumber_cm1: 2954.0, degeneracy: 2}    # e_g CH3 stretch
  - {wavenumber_cm1: 1468.0, degeneracy: 2}    # e_g CH3 deform
  - {wavenumber_cm1: 1190.0, degeneracy: 2}    # e_g CH3 rock
  - {wavenumber_cm1: 2985.0, degeneracy: 2}    # e_u CH3 stretch
  - {wavenumber_cm1: 1460.0, degeneracy: 2}    # e_u CH3 deform
  - {wavenumber_cm1: 822.0, degeneracy: 2}    # e_u CH3 rock
  - {wavenumber_cm1: 2974.0, degeneracy: 2}    # e_u CH3 stretch
# C-C internal rotation (a_u torsion): 3-fold barrier V3 = 1024 cm-1 (~12.25 kJ/mol,
# Weiss & Leroi 1968 / JANAF), internal-rotation constant F = h-bar^2/(2 I_r) = 10.7 cm-1
# (reduced moment I_r = 2.63e-47 kg m^2 = I_CH3/2). sigma_int = 3. The Mathieu levels give a
# torsional fundamental of ~288 cm-1, matching the observed ~289 cm-1.
internal_rotors:
  - {rotation_constant_cm1: 10.7, barrier_cm1: 1024.0, symmetry: 3, n_minima: 3, degeneracy: 1}
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Fundamentals: NIST CCCDB / Herzberg. C-C torsion as hindered rotor (V3=1024 cm-1, F=10.7 cm-1, Weiss & Leroi 1968; JANAF). Nonlinear (D3d), sigma=6; 17 oscillators + 1 internal rotor = 18."

lennard_jones:
  sigma_angstrom: 4.443
  epsilon_over_k: 215.7
  note: "Poling/Prausnitz/O'Connell (viscosity-based)"
