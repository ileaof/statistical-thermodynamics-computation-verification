name: NH3
formula: NH3
molar_mass_gmol: 17.0305
geometry: nonlinear
n_atoms: 4
symmetry_number: 3
# Symmetric top: A=6.196, B=C=9.943 cm-1 -> theta_i = hc*B_i/k
rotational_temperatures: [8.91, 14.31, 14.31]
vibrational_modes:
  - {wavenumber_cm1: 3337.0, degeneracy: 1}    # nu1 symmetric stretch
  - {wavenumber_cm1: 950.0, degeneracy: 1}     # nu2 umbrella
  - {wavenumber_cm1: 3444.0, degeneracy: 2}    # nu3 degenerate stretch
  - {wavenumber_cm1: 1627.0, degeneracy: 2}    # nu4 degenerate bend
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Herzberg; NIST CCCDB. Symmetric top, sigma=3."

lennard_jones:
  sigma_angstrom: 2.9
  epsilon_over_k: 558.3
  note: "Poling/PCO; polar - LJ approximate"

# Validated accuracy of the transport coefficients. Metadata only: nothing here enters
# a calculation. Recorded so a consumer (a CFD solver, say) can see which coefficients
# it can trust and which it cannot.
transport_accuracy:
  viscosity_percent: 1.9
  conductivity_percent: 12.4
  diffusion_percent: 10.0
  basis: "Measured at 300 K against Poling/PCO and CRC (mu, k) and tabulated binary D; see docs/TRANSPORT_CORRECTION_REPORT.md"
  limitation: "Strongly polar: internal-energy transport is suppressed by resonant dipolar exchange (required f_int = 0.71 vs the >= 1 that every mass-diffusion model gives). Beyond Eucken and Mason-Monchick alike."
