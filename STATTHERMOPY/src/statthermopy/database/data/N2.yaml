name: N2
formula: N2
molar_mass_gmol: 28.0134
geometry: linear
n_atoms: 2
symmetry_number: 2
rotational_temperatures: [2.878]
vibrational_modes:
  - {wavenumber_cm1: 2358.57, degeneracy: 1}
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Herzberg; NIST CCCDB. Ground X1Sigma_g+; theta_rot=2.878 K."

lennard_jones:
  sigma_angstrom: 3.798
  epsilon_over_k: 71.4
  note: "Poling/Prausnitz/O'Connell (viscosity-based)"

# Rotational collision number for the Mason-Monchick conductivity. Measured by acoustic
# relaxation, not fitted to k. Parker (1959) supplies the temperature scaling.
rotational_relaxation:
  z_rot_298: 4.0
  reference: "Chemkin/Cantera transport database; ultrasonic relaxation measurements. Independent of any conductivity fit."

# Validated accuracy of the transport coefficients. Metadata only: nothing here enters
# a calculation. Recorded so a consumer (a CFD solver, say) can see which coefficients
# it can trust and which it cannot.
transport_accuracy:
  viscosity_percent: 0.6
  conductivity_percent: 0.7
  diffusion_percent: 5.0
  basis: "Measured at 300 K against Poling/PCO and CRC (mu, k) and tabulated binary D; see docs/TRANSPORT_CORRECTION_REPORT.md"
  limitation: "Binary D is systematically low: the LJ parameters are viscosity-derived and a 12-6 potential cannot fit mu and D at once."
