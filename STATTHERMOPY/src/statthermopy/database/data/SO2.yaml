name: SO2
formula: SO2
molar_mass_gmol: 64.0638
geometry: nonlinear
n_atoms: 3
symmetry_number: 2
# Rotational constants A=2.027, B=0.344, C=0.293 cm-1 -> theta = hc*B/k
rotational_temperatures: [2.918, 0.495, 0.422]
vibrational_modes:
  - {wavenumber_cm1: 1151.0, degeneracy: 1}    # nu1 symmetric stretch
  - {wavenumber_cm1: 517.0, degeneracy: 1}     # nu2 bend
  - {wavenumber_cm1: 1362.0, degeneracy: 1}    # nu3 asymmetric stretch
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Herzberg; NIST CCCDB. Nonlinear, sigma=2."

lennard_jones:
  sigma_angstrom: 4.112
  epsilon_over_k: 335.4
  note: "Poling/PCO; polar - LJ approximate"

# Validated accuracy of the transport coefficients. Metadata only: nothing here enters
# a calculation. Recorded so a consumer (a CFD solver, say) can see which coefficients
# it can trust and which it cannot.
transport_accuracy:
  viscosity_percent: 1.3
  conductivity_percent: 4.9
  diffusion_percent: 12.0
  basis: "Measured at 300 K against Poling/PCO and CRC (mu, k) and tabulated binary D; see docs/TRANSPORT_CORRECTION_REPORT.md"
  limitation: "Strongly polar: internal-energy transport is suppressed by resonant dipolar exchange (required f_int = 0.91 vs the >= 1 that every mass-diffusion model gives). Beyond Eucken and Mason-Monchick alike."
