name: C3H8
formula: C3H8
molar_mass_gmol: 44.0956
geometry: nonlinear
n_atoms: 11
symmetry_number: 2
# Propane is a low-symmetry asymmetric top; approximate rotational constants
# A~0.475, B~0.280, C~0.230 cm-1 -> theta = hc*B/k.
rotational_temperatures: [0.683, 0.403, 0.331]
# 27 internal DOF (3N-6 = 27): 25 harmonic oscillators (experimental gas-phase fundamentals
# from the Shimanouchi 1972 compilation via the NIST WebBook, C2v, all non-degenerate) PLUS the
# two low methyl torsions (was 216, 268 cm-1) treated as 1-D hindered internal rotors below.
# 25 oscillators + 2 internal rotors = 27. Replaces earlier approximate grouped values.
vibrational_modes:
  - {wavenumber_cm1: 369.0, degeneracy: 1}     # a1 CCC deform
  - {wavenumber_cm1: 748.0, degeneracy: 1}     # b2 CH2 rock
  - {wavenumber_cm1: 869.0, degeneracy: 1}     # a1 CC str
  - {wavenumber_cm1: 922.0, degeneracy: 1}     # b1 CH3 rock
  - {wavenumber_cm1: 940.0, degeneracy: 1}     # a2 CH3 rock
  - {wavenumber_cm1: 1054.0, degeneracy: 1}    # b1 CC str
  - {wavenumber_cm1: 1158.0, degeneracy: 1}    # a1 CH3 rock
  - {wavenumber_cm1: 1192.0, degeneracy: 1}    # b2 CH3 rock
  - {wavenumber_cm1: 1278.0, degeneracy: 1}    # a2 CH2 twist
  - {wavenumber_cm1: 1338.0, degeneracy: 1}    # b1 CH2 wag
  - {wavenumber_cm1: 1378.0, degeneracy: 1}    # b1 CH3 s-deform
  - {wavenumber_cm1: 1392.0, degeneracy: 1}    # a1 CH3 s-deform
  - {wavenumber_cm1: 1451.0, degeneracy: 1}    # a2 CH3 d-deform
  - {wavenumber_cm1: 1462.0, degeneracy: 1}    # a1 CH2 scis
  - {wavenumber_cm1: 1464.0, degeneracy: 1}    # b1 CH3 d-deform
  - {wavenumber_cm1: 1472.0, degeneracy: 1}    # b2 CH3 d-deform
  - {wavenumber_cm1: 1476.0, degeneracy: 1}    # a1 CH3 d-deform
  - {wavenumber_cm1: 2887.0, degeneracy: 2}    # a1 + b1 CH2/CH3 s-str
  - {wavenumber_cm1: 2962.0, degeneracy: 1}    # a1 CH3 s-str
  - {wavenumber_cm1: 2967.0, degeneracy: 1}    # a2 CH3 d-str
  - {wavenumber_cm1: 2968.0, degeneracy: 2}    # b1 CH3 s-str + b2 CH2 a-str
  - {wavenumber_cm1: 2973.0, degeneracy: 1}    # b2 CH3 d-str
  - {wavenumber_cm1: 2977.0, degeneracy: 1}    # a1 CH3 d-str
# Two methyl internal rotations (replacing the 216 & 268 cm-1 torsions): 3-fold barrier
# V3 = 1190 cm-1 (~3.4 kcal/mol ~14.2 kJ/mol), internal-rotation constant F = 5.3 cm-1
# (methyl top against the heavy frame, I_r ~ 5.3e-47 kg m^2), sigma_int = 3 each. Modelled as
# two independent identical rotors (top-top coupling, which splits 216/268, is neglected); the
# Mathieu levels give a torsional fundamental of ~237 cm-1, between the two observed values.
internal_rotors:
  - {rotation_constant_cm1: 5.3, barrier_cm1: 1190.0, symmetry: 3, n_minima: 3, degeneracy: 2}
electronic_levels:
  - {energy_cm1: 0.0, degeneracy: 1}
references: "Shimanouchi (1972) gas-phase fundamentals via NIST WebBook. Methyl torsions as hindered rotors (V3=1190 cm-1, F=5.3 cm-1). Nonlinear asymmetric top, sigma=2; 25 oscillators + 2 internal rotors = 27."

lennard_jones:
  sigma_angstrom: 5.118
  epsilon_over_k: 237.1
  note: "Poling/Prausnitz/O'Connell (viscosity-based)"
